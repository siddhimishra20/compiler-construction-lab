<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 780" width="420" height="780" font-family="'Segoe UI', Arial, sans-serif">

  <!-- Background -->
  <rect width="420" height="780" fill="#0f1117" rx="16"/>

  <!-- Title -->
  <text x="210" y="38" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="700" letter-spacing="1">COMPILER PIPELINE</text>
  <line x1="60" y1="48" x2="360" y2="48" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Color palette per stage -->
  <!-- Source: blue, Lexical: purple, Syntax: indigo, Semantic: teal, Symbol: green, ICG: yellow, Opt: orange, Target: red -->

  <!-- 1. Source Program -->
  <rect x="60" y="62" width="300" height="58" rx="10" fill="#1e3a5f"/>
  <rect x="60" y="62" width="6" height="58" rx="3" fill="#4a9eff"/>
  <text x="210" y="87" text-anchor="middle" fill="#4a9eff" font-size="13" font-weight="700">SOURCE PROGRAM</text>
  <text x="210" y="107" text-anchor="middle" fill="#a0c4f1" font-size="11">High-level source code input</text>

  <!-- Arrow -->
  <line x1="210" y1="120" x2="210" y2="138" stroke="#555" stroke-width="2"/>
  <polygon points="210,142 205,132 215,132" fill="#555"/>

  <!-- 2. Lexical Analysis -->
  <rect x="60" y="144" width="300" height="58" rx="10" fill="#2d1b4e"/>
  <rect x="60" y="144" width="6" height="58" rx="3" fill="#a855f7"/>
  <text x="210" y="169" text-anchor="middle" fill="#a855f7" font-size="13" font-weight="700">LEXICAL ANALYSIS</text>
  <text x="210" y="189" text-anchor="middle" fill="#c4a0f1" font-size="11">Tokenizes source → stream of tokens</text>

  <!-- Arrow -->
  <line x1="210" y1="202" x2="210" y2="220" stroke="#555" stroke-width="2"/>
  <polygon points="210,224 205,214 215,214" fill="#555"/>

  <!-- 3. Syntax Analysis -->
  <rect x="60" y="226" width="300" height="58" rx="10" fill="#1a1f4e"/>
  <rect x="60" y="226" width="6" height="58" rx="3" fill="#6366f1"/>
  <text x="210" y="251" text-anchor="middle" fill="#6366f1" font-size="13" font-weight="700">SYNTAX ANALYSIS</text>
  <text x="210" y="271" text-anchor="middle" fill="#a0a4f1" font-size="11">Builds parse tree / AST from tokens</text>

  <!-- Arrow -->
  <line x1="210" y1="284" x2="210" y2="302" stroke="#555" stroke-width="2"/>
  <polygon points="210,306 205,296 215,296" fill="#555"/>

  <!-- 4. Semantic Analysis -->
  <rect x="60" y="308" width="300" height="58" rx="10" fill="#0f3535"/>
  <rect x="60" y="308" width="6" height="58" rx="3" fill="#14b8a6"/>
  <text x="210" y="333" text-anchor="middle" fill="#14b8a6" font-size="13" font-weight="700">SEMANTIC ANALYSIS</text>
  <text x="210" y="353" text-anchor="middle" fill="#80d8d0" font-size="11">Type checking, scope resolution</text>

  <!-- Arrow -->
  <line x1="210" y1="366" x2="210" y2="384" stroke="#555" stroke-width="2"/>
  <polygon points="210,388 205,378 215,378" fill="#555"/>

  <!-- 5. Symbol Table -->
  <rect x="60" y="390" width="300" height="58" rx="10" fill="#0f2e1a"/>
  <rect x="60" y="390" width="6" height="58" rx="3" fill="#22c55e"/>
  <text x="210" y="415" text-anchor="middle" fill="#22c55e" font-size="13" font-weight="700">SYMBOL TABLE MANAGEMENT</text>
  <text x="210" y="435" text-anchor="middle" fill="#86efac" font-size="11">Tracks identifiers, types, scopes</text>

  <!-- Arrow -->
  <line x1="210" y1="448" x2="210" y2="466" stroke="#555" stroke-width="2"/>
  <polygon points="210,470 205,460 215,460" fill="#555"/>

  <!-- 6. Intermediate Code Generation -->
  <rect x="60" y="472" width="300" height="58" rx="10" fill="#2e2500"/>
  <rect x="60" y="472" width="6" height="58" rx="3" fill="#eab308"/>
  <text x="210" y="497" text-anchor="middle" fill="#eab308" font-size="13" font-weight="700">INTERMEDIATE CODE GEN</text>
  <text x="210" y="517" text-anchor="middle" fill="#fde68a" font-size="11">Produces 3-address code / IR</text>

  <!-- Arrow -->
  <line x1="210" y1="530" x2="210" y2="548" stroke="#555" stroke-width="2"/>
  <polygon points="210,552 205,542 215,542" fill="#555"/>

  <!-- 7. Code Optimization -->
  <rect x="60" y="554" width="300" height="58" rx="10" fill="#2e1500"/>
  <rect x="60" y="554" width="6" height="58" rx="3" fill="#f97316"/>
  <text x="210" y="579" text-anchor="middle" fill="#f97316" font-size="13" font-weight="700">CODE OPTIMIZATION</text>
  <text x="210" y="599" text-anchor="middle" fill="#fdba74" font-size="11">Reduces redundancy, improves perf</text>

  <!-- Arrow -->
  <line x1="210" y1="612" x2="210" y2="630" stroke="#555" stroke-width="2"/>
  <polygon points="210,634 205,624 215,624" fill="#555"/>

  <!-- 8. Target Code Generation -->
  <rect x="60" y="636" width="300" height="58" rx="10" fill="#2e0f0f"/>
  <rect x="60" y="636" width="6" height="58" rx="3" fill="#ef4444"/>
  <text x="210" y="661" text-anchor="middle" fill="#ef4444" font-size="13" font-weight="700">TARGET CODE GENERATION</text>
  <text x="210" y="681" text-anchor="middle" fill="#fca5a5" font-size="11">Outputs machine / assembly code</text>

  <!-- Footer -->
  <line x1="60" y1="714" x2="360" y2="714" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
  <text x="210" y="735" text-anchor="middle" fill="#ffffff" fill-opacity="0.3" font-size="10">Compiler Construction Lab</text>

</svg>
